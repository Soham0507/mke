<style>
html,body{margin:0;height:100%}
body{background:#0B1F3A;background-image:radial-gradient(circle at 85% 10%,rgba(255,199,44,.18),transparent 40%),radial-gradient(circle at 10% 90%,rgba(255,255,255,.06),transparent 45%);display:flex;align-items:center;justify-content:center;font-family:'Public Sans',sans-serif}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 10px #050E1C,0 0 0 11px #2A4268}
@media (max-width:500px),(max-height:880px) and (max-width:900px){body{display:block}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
@media (max-height:880px) and (min-width:901px){.phone{transform:scale(calc(100vh / 900px));transform-origin:center}}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
input,textarea{font:inherit}
.disp{font-family:'Archivo',sans-serif;font-stretch:118%;letter-spacing:-0.4px}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.tdot{width:7px;height:7px;border-radius:4px;background:#0B1F3A;display:inline-block;animation:tdot 1.1s infinite}
.tdot:nth-child(2){animation-delay:.15s}.tdot:nth-child(3){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .28s ease-out both}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

const BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));
const ADDRESSES = [['Main St & 5th Ave', 'From your location'], ['1200 Elm St', 'Typed address'], ['Oak Ave & River Rd', 'Pin dropped on map']];
const CORNER_POS = { nw: 'left:14px;top:14px', ne: 'right:14px;top:14px', sw: 'left:14px;bottom:14px', se: 'right:14px;bottom:14px' };
const CORNER_NAME = { nw: 'NW', ne: 'NE', sw: 'SW', se: 'SE' };
const STATUS = ['Submitted', 'Routed', 'Crew assigned', 'Fixed'];
const SHORT = { size: 'Size', where: 'Position', count: 'Lights out', ltype: 'Type', problem: 'Problem', lights: 'Lights', corners: 'Corners', cart: 'Cart', when: 'Missed', wires: 'Power lines', blocking: 'Blocking', on: 'On', offensive: 'Offensive', depth: 'Water', what: 'Debris', lane: 'Lane blocked', stype: 'Sign', state: 'State', issue: 'Issue', op: 'Company', bags: 'Bags', kind: 'Need', seen: 'Seen', cond: 'Condition' };
const deptOf = (t) => t.dept || DEPT[t.cat];

const EMERGENCY = /fire|smoke|gas leak|smell(s|ing)? (of )?gas|bleed|injur|hurt|unconscious|not breathing|shoot|shot|\bgun\b|stab|live wire|wires? down|power ?lines? down/;
const RULES = [
  [/(when|what day|schedule|next).*(garbage|trash|recycl|pickup|collection)|(garbage|trash|recycl).*(day|schedule)/, 'i-schedule'],
  [/sign ?up|alert|notif|e-?notify/, 'i-notify'],
  [/\bjobs?\b|hiring|employ|work for the city/, 'i-jobs'],
  [/crime|\btips?\b|suspicious|drug deal/, 'i-tips'],
  [/homeless|sleeping (outside|outdoors|on)|unhoused|encampment/, 'i-outreach'],
  [/zoning|boza|appeal/, 'i-zoning'],
  [/traffic ?(light|signal)|stop ?light|\bsignal|walk sign|red light|green light|yellow light|crosswalk light/, 'signal'],
  [/street ?lights?|lamp|alley light|light.*\b(out|dark|broken|off|flicker)|dark (street|alley|block)/, 'light'],
  [/pot ?holes?|hole in|crack|pavement|road.*(damage|broken)/, 'pothole'],
  [/plant (a )?(new )?tree|new tree|replace.*tree/, 'planttree'],
  [/lea(f|ves)/, 'leaves'],
  [/garbage|trash|recycl|pick ?up|\bcart|\bbins?\b|collection|missed/, 'garbage'],
  [/tree|branch|limb/, 'tree'],
  [/weeds?|tall grass|overgrown|grass/, 'weeds'],
  [/graffiti|tag(ged|ging|s)?\b|spray ?paint|vandal/, 'graffiti'],
  [/sewer|drain|grate|flood|ponding|standing water|catch basin/, 'sewer'],
  [/debris|glass|crash|accident|car parts/, 'debris'],
  [/scooter|\blime\b|\bbird\b/, 'scooter'],
  [/\brats?\b|rodent|\bmice\b|mouse/, 'rats'],
  [/abandon|junk car|car.*(parked|sitting|hasn)|vehicle/, 'vehicle'],
  [/\bsigns?\b|stop sign|yield|street name|pavement marking|crosswalk/, 'sign']
];
const classify = (text) => {
  const s = text.toLowerCase();
  if (EMERGENCY.test(s)) return { kind: 'emergency' };
  for (const [re, id] of RULES) if (re.test(s)) return { kind: BY_ID[id].info ? 'info' : 'type', id };
  return { kind: 'unknown' };
};
const GREETING = [
  { from: 'agent', kind: 'text', text: 'Hi, I’m the City Agent. Tell me what’s wrong in your own words. I’ll work out which crew handles it, ask a couple of quick questions, and file it for you.' },
  { from: 'agent', kind: 'choices', step: 'suggest', text: 'Or start with one of these:', opts: ['The streetlight on my block is out', 'My recycling wasn’t picked up', 'Big pothole on my street', 'When is my garbage day?'] }
];

const Icon = (d, stroke, size = 22, sw = 2) => html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke=${stroke} stroke-width=${sw} stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${d} /></svg>`;
const SPARK = 'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z';
const BACK = 'm15 18-6-6 6-6';
const PHONE = 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2';
const CHECK = 'm5 12 5 5 9-10';

class App extends Component {
  constructor(p) {
    super(p);
    this._mid = 0;
    this.state = {
      screen: 'home', from: 'home', typeId: null, q: '', cat: 'all', answers: {}, note: '', photo: false,
      name: '', phone: '', isPublic: true, addr: 0, curId: 'R-1042', toast: '', unread: true, seq: 1043,
      requests: [ { id: 'R-1042', typeId: 'signal', summary: 'All dark · NE, SW corners', where: 'Main St & 5th Ave', status: 2, followed: true, times: ['Tue 9:41 PM', 'Tue 9:42 PM', 'Today 8:15 AM'] } ],
      msgs: this.stamp(GREETING), typing: false, draft: '', flow: null
    };
    this.chatRef = (el) => { this._chat = el; };
  }
  stamp(list) { return list.map(m => ({ ...m, id: ++this._mid })); }
  componentDidUpdate() { if (this._chat) this._chat.scrollTop = this._chat.scrollHeight; }
  componentWillUnmount() { clearTimeout(this._t); (this._timers || []).forEach(clearTimeout); }
  later(fn, ms) { this._timers = this._timers || []; this._timers.push(setTimeout(fn, ms)); }
  now() { return 'Today ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2600); }

  createRequest(t, summary, addr) {
    const id = 'R-' + this.state.seq;
    const req = { id, typeId: t.id, summary, where: ADDRESSES[addr][0], status: 0, followed: true, times: [this.now()] };
    this.setState(s => ({ requests: [req, ...s.requests], seq: s.seq + 1, curId: id }));
    this.later(() => this.setState(s => ({ unread: true, requests: s.requests.map(r => r.id === id && r.status === 0 ? { ...r, status: 1, times: [...r.times, this.now()] } : r) })), 3500);
    return id;
  }
  openType(t) {
    if (t.info) { this.setState({ screen: 'info', typeId: t.id }); return; }
    this.setState({ from: this.state.screen, screen: 'form', typeId: t.id, answers: {}, note: '', photo: false, isPublic: !t.private });
  }

  say(list, extra) {
    this.setState({ typing: true });
    this.later(() => this.setState(s => ({ typing: false, msgs: [...s.msgs, ...this.stamp(list)], ...(extra || {}) })), 650);
  }
  user(text, closeId) {
    this.setState(s => ({ msgs: [...s.msgs.map(m => m.id === closeId ? { ...m, closed: true } : m), ...this.stamp([{ from: 'user', kind: 'text', text }])] }));
  }
  questionFor(flow) {
    const t = BY_ID[flow.typeId];
    if (flow.stage === 'fields') {
      const f = t.fields[flow.fi];
      if (f.kind === 'corners') return [{ from: 'agent', kind: 'choices', step: 'field', multi: true, text: 'Which corners have the broken signal? Pick all that apply, then tap Done.', opts: ['NE', 'NW', 'SE', 'SW', 'Done'] }];
      return [{ from: 'agent', kind: 'choices', step: 'field', multi: f.kind === 'many', text: f.label + (f.kind === 'many' ? ' Pick any, then tap Done.' : ''), opts: f.kind === 'many' ? [...f.opts, 'Done'] : f.opts }];
    }
    if (flow.stage === 'loc') return [{ from: 'agent', kind: 'choices', step: 'loc', text: 'Where is it? I have ' + ADDRESSES[this.state.addr][0] + ' (' + ADDRESSES[this.state.addr][1].toLowerCase() + ').', opts: ['Yes, right here', 'Use a different spot'] }];
    if (flow.stage === 'contact') return [{ from: 'agent', kind: 'choices', step: 'contact', text: 'This one needs a name and phone so the crew can reach you. Use the ones saved on your profile?', opts: ['Use my profile', 'I’ll type them in'] }];
    if (flow.stage === 'confirm') {
      const lines = [{ k: 'Request', v: t.name }, { k: 'Crew', v: deptOf(t) }];
      t.fields.forEach(f => { const v = flow.answers[f.id]; if (v) lines.push({ k: SHORT[f.id] || f.id, v: Array.isArray(v) ? v.join(', ') : v }); });
      lines.push({ k: 'Where', v: ADDRESSES[this.state.addr][0] });
      return [{ from: 'agent', kind: 'summary', step: 'confirm', lines, opts: ['File it', 'Edit in form'] }];
    }
    return [];
  }
  advance(flow, pre) {
    const t = BY_ID[flow.typeId];
    let next = { ...flow, multi: [] };
    if (next.stage === 'fields') { next.fi++; if (next.fi >= t.fields.length) next.stage = 'loc'; }
    else if (next.stage === 'loc') next.stage = t.contact ? 'contact' : 'confirm';
    else if (next.stage === 'contact') next.stage = 'confirm';
    this.say([...(pre || []), ...this.questionFor(next)], { flow: next });
  }
  startFlow(t) {
    const flow = { typeId: t.id, fi: 0, stage: 'fields', answers: {}, multi: [] };
    this.say([
      { from: 'agent', kind: 'text', text: 'Got it. That’s a ' + t.name.toLowerCase() + ' report, which ' + deptOf(t) + ' handles. I’ll send it straight to them.' },
      { from: 'agent', kind: 'route', typeId: t.id },
      ...this.questionFor(flow)
    ], { flow });
  }
  respond(text) {
    const r = classify(text);
    if (r.kind === 'emergency') {
      this.say([{ from: 'agent', kind: 'emergency', title: 'This sounds like an emergency', text: 'If anyone is hurt or in danger, or there’s fire, gas or a downed power line, call 911 now. Don’t wait on an app.', cta: 'Call 911', href: 'tel:911' }], { flow: null });
    } else if (r.kind === 'info') {
      this.say([{ from: 'agent', kind: 'text', text: 'That one isn’t a repair request, so there’s nothing to file. Here’s where to go:' }, { from: 'agent', kind: 'info', typeId: r.id }], { flow: null });
    } else if (r.kind === 'type') {
      this.startFlow(BY_ID[r.id]);
    } else {
      this.say([{ from: 'agent', kind: 'choices', step: 'unknown', text: 'I couldn’t match that to a service yet. Is it one of these?', opts: ['Pothole', 'Streetlight out', 'Missed pickup', 'Tree down', 'Something else'] }], { flow: null });
    }
  }
  activeMsg() { const ms = this.state.msgs; for (let i = ms.length - 1; i >= 0; i--) { if (ms[i].opts) return ms[i].closed ? null : ms[i]; } return null; }
  send(raw) {
    const text = (raw || '').trim();

      if (m.kind === 'summary') return html`

      ${v.blocked ? html`
        <a href=${v.blockHref} style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:18px;background:#B42318;color:#fff;font-size:16px;font-weight:900">${v.blockLabel}</a>` : html`
        <div style="font-size:12px;font-weight:600;color:#4A5868;text-align:center">${v.progressText}</div>
        <button onClick=${v.submit} disabled=${v.notReady} style=${v.submitStyle}>Submit report</button>`}
    </div>`;
  }

  info(v) {
    return html`
    <div style="background:#0B1F3A;color:#fff;padding:12px 20px 26px;display:flex;flex-direction:column;gap:14px;border-radius:0 0 28px 28px;flex-shrink:0">
      ${this.backBtn(v.goServices, 'Back')}
      <div style="width:56px;height:56px;border-radius:18px;background:#FFC72C;display:flex;align-items:center;justify-content:center">${Icon(v.info.icon, '#0B1F3A', 28, 1.9)}</div>
      <h1 class="disp" style="margin:0;font-size:28px;font-weight:900;line-height:1.05">${v.info.name}</h1>
    </div>
    <div style="flex-grow:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px">
      <p style="margin:0;font-size:16px;color:#33404F;line-height:1.55">${v.info.long}</p>
      <a href="#" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:18px;background:#FFC72C;font-size:16px;font-weight:900">${v.info.cta}</a>
      <p style="margin:0;font-size:12px;color:#4A5868;text-align:center">Opens outside the app</p>
    </div>`;
  }

  track(v) {
    const c = v.cur;
    return html`
    <div style="background:#0B1F3A;color:#fff;padding:12px 20px 24px;display:flex;flex-direction:column;gap:10px;border-radius:0 0 28px 28px;position:relative;overflow:hidden;flex-shrink:0">
      <div aria-hidden="true" style="position:absolute;right:-60px;bottom:-80px;width:200px;height:200px;border-radius:100px;border:24px solid #FFC72C;opacity:0.14"></div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        ${this.backBtn(v.goList, 'Back to my requests')}
        <span style="font-size:12px;font-weight:800;letter-spacing:0.8px;color:#B9C4D4">REQUEST ${c.id}</span>
        <span style="width:44px"></span>
      </div>
      <span style="align-self:flex-start;font-size:12px;font-weight:800;color:#0B1F3A;background:#FFC72C;padding:5px 10px;border-radius:999px">${c.kicker}</span>
      <h1 class="disp" style="margin:0;font-size:28px;font-weight:900;line-height:1.05;position:relative">${c.headline}</h1>
      <div style="font-size:14px;color:#D3DAE5;line-height:1.4;position:relative">${c.title} · ${c.summary}</div>
      <div style="font-size:13px;color:#B9C4D4;position:relative">${c.where}</div>
    </div>
    <div style="flex-grow:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px">
      <div style="background:#fff;border-radius:20px;padding:18px">
        <h2 class="disp" style="margin:0 0 16px;font-size:17px;font-weight:800">Progress</h2>
        <ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column">
          ${c.steps.map(s => html`
            <li style="display:flex;gap:14px">
              <div style="display:flex;flex-direction:column;align-items:center;width:24px">
                <div style=${s.dot}></div>
                ${s.line && html`<div style=${s.lineStyle}></div>`}
              </div>
              <div style="padding-bottom:18px">
                <div style=${s.titleStyle}>${s.t}</div>
                <div style="font-size:13px;color:#4A5868;margin-top:2px">${s.d}</div>
              </div>
            </li>`)}
        </ol>
      </div>
      <div style="display:flex;gap:10px">
        <button onClick=${c.toggleFollow} aria-pressed=${c.followed} style=${c.followStyle}>${c.followLabel}</button>
        <button onClick=${v.goHome} style="flex:1 1 0;height:52px;border-radius:16px;border:0;background:#0B1F3A;color:#fff;font-size:15px;font-weight:800">Done</button>
      </div>
      ${c.canAdvance && html`<button onClick=${c.advance} style="border:1px dashed #A9B4C0;background:transparent;border-radius:14px;min-height:44px;font-size:13px;font-weight:700;color:#4A5868">Prototype: simulate next city update</button>`}
    </div>`;
  }

  list(v) {
    return html`
    <div style="background:#0B1F3A;color:#fff;padding:22px 20px;border-radius:0 0 28px 28px;flex-shrink:0">
      <h1 class="disp" style="margin:0;font-size:30px;font-weight:900">My requests</h1>
      <div style="font-size:13px;color:#B9C4D4;margin-top:4px">${v.reqCountLabel}</div>
    </div>
    <div style="flex-grow:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:10px">
      ${v.reqCards.map(r => html`
        <button onClick=${r.open} style="background:#fff;border:0;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left">
          <span style="display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px">
            <span class="disp" style="font-size:16px;font-weight:800">${r.title}</span>
            <span style=${r.pill}>${r.statusLabel}</span>
          </span>
          <span style="display:block;font-size:13px;color:#4A5868">${r.summary} · ${r.id}</span>
          <span style="display:grid;width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px">${r.bars.map(b => html`<span style=${b.style2}></span>`)}</span>
        </button>`)}
    </div>`;
  }

  tabs(v) {
    return html`
    <nav aria-label="Main" style="display:flex;justify-content:space-around;align-items:center;height:78px;background:#fff;border-top:1px solid #E3E8EE;padding-bottom:10px;box-sizing:border-box;flex-shrink:0">
      <button onClick=${v.goHome} style=${v.tab.home}>${Icon('M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', 'currentColor', 22, 2.1)}Home</button>
      <button onClick=${v.goServices} style=${v.tab.services}>${Icon('M4.5 3h4A1.5 1.5 0 0 1 10 4.5v4A1.5 1.5 0 0 1 8.5 10h-4A1.5 1.5 0 0 1 3 8.5v-4A1.5 1.5 0 0 1 4.5 3zM15.5 3h4A1.5 1.5 0 0 1 21 4.5v4a1.5 1.5 0 0 1-1.5 1.5h-4A1.5 1.5 0 0 1 14 8.5v-4A1.5 1.5 0 0 1 15.5 3zM4.5 14h4a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 8.5 21h-4A1.5 1.5 0 0 1 3 19.5v-4A1.5 1.5 0 0 1 4.5 14zM15.5 14h4a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a1.5 1.5 0 0 1-1.5-1.5v-4a1.5 1.5 0 0 1 1.5-1.5z', 'currentColor', 22, 2.1)}Services</button>
      <button onClick=${v.openAgent} aria-label="City Agent" style="width:52px;height:52px;border-radius:17px;border:0;background:#FFC72C;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(11,31,58,0.18);padding:0;flex-shrink:0">${Icon(SPARK, '#0B1F3A', 26, 2.2)}</button>
      <button onClick=${v.goList} style=${v.tab.list}>${Icon('M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', 'currentColor', 22, 2.1)}Requests</button>
      <a href="tel:0000000000" style=${v.tab.call}>${Icon(PHONE, 'currentColor', 22, 2.1)}Call</a>
    </nav>`;
  }

  render() {
    const v = this.vals();
    const screens = { home: this.home, agent: this.agent, services: this.services, form: this.form, info: this.info, track: this.track, list: this.list };
    return html`
    <div style="width:100%;height:100%;box-sizing:border-box;background:#F2F4F7;color:#0B1F3A;font-family:'Public Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative">
      ${screens[v.sc].call(this, v)}
      ${v.showTabs && this.tabs(v)}
      ${v.toast && html`
        <div role="status" class="rise" style="position:absolute;left:16px;right:16px;top:14px;background:#FFC72C;color:#0B1F3A;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:800;box-shadow:0 10px 28px rgba(11,31,58,0.3);display:flex;gap:10px;align-items:center">${Icon(CHECK, '#0B1F3A', 18, 3)}${v.toast}</div>`}
    </div>`;
  }
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
